# secrets.properties 로 복사해 값을 채운다(secrets.properties 는 gitignored).
# 값이 비어 있어도 앱은 빌드·실행된다 — 로그인만 꺼진다.
API_BASE=https://clipnote.co.kr
SUPABASE_URL=
SUPABASE_ANON_KEY=
NAVER_CLIENT_ID=

# AdMob: 아래는 구글 공식 "테스트" 공개 ID(실 시크릿이 아니다). 실배포는 secrets.properties 에 실 ID 를 채운다.
# App ID 는 `~`, 광고 단위는 `/` 로 구분된다 — 둘 다 `ca-app-pub-` 로 시작하고 길이가 같아
# 눈으로 구분되지 않는다. **이 칸을 바꿔 넣으면 앱이 실행 즉시 죽는다**(iOS 1.1.0 사고).
ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
ADMOB_BANNER_UNIT_ID=ca-app-pub-3940256099942544/6300978111

# 릴리스 서명(선택). 비워 두면 릴리스 서명 설정을 만들지 않는다.
