org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Kotlin 컴파일 데몬을 UTF-8 로 띄운다.
#
# 테스트 이름을 백틱 한국어로 쓰면 클래스 파일 이름에 한글이 들어간다. 데몬이 POSIX 로케일로
# 뜨는 머신(도커 이미지·일부 CI)에서는 그 경로를 만들지 못해 "Internal compiler error" 로 죽는다.
# 오류 문구가 원인을 가리키지 않아서 한참 헤매게 되는 종류다.
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
